# Copy to repo root:  cp examples/jobsearch.settings.yaml jobsearch.settings.yaml
#
# Priority (highest first):
#   1. JOBSEARCH_COLLECT_HEADED=1 in the environment
#   2. browser.linkedin_collect_visible in this file
#   3. default: headless Patchright (no visible window)
#
# Visible Chrome helps debug login redirects, captchas, and empty feeds during ingestion.

browser:
  # true = show Google Chrome while LinkedIn posts/jobs collect runs (UI ingestion + CLI)
  linkedin_collect_visible: true
