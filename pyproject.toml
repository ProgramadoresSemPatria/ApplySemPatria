[project]
name = "jobsearch-cli"
version = "0.1.0"
description = "Multi-track job discovery and apply CLI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: live network tests (excluded from default CI)",
    "playwright: browser tests using Patchright/Playwright",
    "browser: file:// HTML baseline flow tests (Patchright, no HAR)",
    "har: HAR replay browser tests (offline LinkedIn mock)",
    "llm_judge: optional LLM-as-judge (skipped without API key)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["scripts"]
branch = true
parallel = true
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "scripts/check_coverage_thresholds.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 19
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# Run without install:
#   python3 ~/job-search/scripts/jobsearch.py tracks list
#   python3 ~/job-search/scripts/jobsearch.py doctor
