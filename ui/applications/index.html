<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jobsearch · Applications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080d;
      --bg-elevated: #0e1018;
      --surface: rgba(22, 25, 38, 0.72);
      --surface-hover: rgba(32, 36, 54, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.14);
      --text: #eef0f6;
      --muted: #8b92a8;
      --accent: #6ee7ff;
      --accent-2: #a78bfa;
      --green: #34d399;
      --green-bg: rgba(52, 211, 153, 0.12);
      --amber: #fbbf24;
      --rose: #fb7185;
      --radius: 16px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --sidebar-w: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(110, 231, 255, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(167, 139, 250, 0.12), transparent),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(52, 211, 153, 0.06), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* —— Sidebar —— */
    .sidebar {
      border-right: 1px solid var(--border);
      background: rgba(10, 12, 20, 0.85);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 0.5rem 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #07080d;
      box-shadow: 0 8px 24px rgba(110, 231, 255, 0.25);
    }

    .brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .sidebar-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      padding: 0 0.5rem;
      margin-bottom: 0.65rem;
    }

    .day-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding-right: 4px;
    }

    .day-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .day-btn:hover {
      background: var(--surface);
      border-color: var(--border);
    }

    .day-btn.active {
      background: linear-gradient(135deg, rgba(110, 231, 255, 0.12), rgba(167, 139, 250, 0.1));
      border-color: rgba(110, 231, 255, 0.35);
      box-shadow: 0 4px 20px rgba(110, 231, 255, 0.08);
    }

    .day-btn .date {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .day-btn .meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .day-count {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .day-btn.active .day-count {
      background: rgba(110, 231, 255, 0.2);
      color: var(--accent);
    }

    .sidebar-footer {
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      margin-top: 1rem;
    }

    .live-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px dashed var(--border-bright);
      background: transparent;
      color: var(--accent);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .live-btn:hover { background: rgba(110, 231, 255, 0.08); }

    /* —— Main —— */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 12, 20, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    .toolbar h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      flex: 1;
      min-width: 200px;
    }

    .toolbar h2 span { color: var(--muted); font-weight: 500; font-size: 0.95rem; }

    .search {
      flex: 1;
      min-width: 220px;
      max-width: 360px;
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search input:focus { border-color: rgba(110, 231, 255, 0.4); }

    .search::before {
      content: "⌕";
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
    }

    .filters {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .chip {
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover, .chip.active {
      color: var(--text);
      border-color: rgba(110, 231, 255, 0.35);
      background: rgba(110, 231, 255, 0.08);
    }

    .cards-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.75rem 2rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.1rem;
    }

    /* —— Card —— */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      backdrop-filter: blur(16px);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--border-bright);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .card-company {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-track { background: rgba(167, 139, 250, 0.15); color: #c4b5fd; }
    .badge-review { background: rgba(251, 146, 60, 0.14); color: #fdba74; }
    .badge-channel-email { background: rgba(110, 231, 255, 0.12); color: var(--accent); }
    .badge-channel-url { background: rgba(251, 191, 36, 0.12); color: var(--amber); }
    .badge-channel-dm { background: rgba(52, 211, 153, 0.12); color: var(--green); }
    .badge-section { background: rgba(255,255,255,0.06); color: var(--muted); }

    .format-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .format-tags .badge {
      font-size: 0.58rem;
      padding: 0.16rem 0.45rem;
      letter-spacing: 0.05em;
    }

    .card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
      font-size: 0.8rem;
    }

    .meta-item label {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .meta-item span {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
    }

    .meta-item-full {
      grid-column: 1 / -1;
    }

    .meta-item .format-tags {
      margin-top: 2px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      width: fit-content;
    }

    .status-pill.done { background: var(--green-bg); color: var(--green); }

    .steps-block {
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .steps-block label {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    .step-pills {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .step-pill {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid var(--border);
      width: 100%;
      font-family: inherit;
      text-align: left;
      transition: all 0.15s ease;
    }

    .step-pill.clickable {
      cursor: pointer;
    }

    .step-pill.clickable:hover {
      background: var(--surface-hover);
      border-color: var(--border-bright);
      color: var(--text);
    }

    .step-pill.done {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-color: var(--border);
    }

    .step-pill.done .step-icon {
      color: var(--green);
      font-weight: 700;
    }

    .step-pill.progress {
      background: rgba(251, 191, 36, 0.1);
      color: var(--amber);
      border-color: rgba(251, 191, 36, 0.28);
    }

    .step-pill.loading {
      opacity: 0.65;
      pointer-events: none;
    }

    .step-pill .step-icon {
      flex-shrink: 0;
      width: 1.1rem;
      text-align: center;
      font-size: 0.8rem;
    }

    .step-pill .step-label {
      flex: 1;
      min-width: 0;
    }

    .step-pill .step-status {
      opacity: 0.85;
      font-size: 0.68rem;
      white-space: nowrap;
      color: var(--muted);
    }

    .step-pill.done .step-status {
      opacity: 0.85;
      color: var(--muted);
    }

    .card-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .card-links a {
      font-size: 0.72rem;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.85;
    }

    .card-links a:hover { opacity: 1; text-decoration: underline; }

    /* legacy action styles removed — use step-pill */

    .empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .empty h3 { font-size: 1.1rem; color: var(--text); margin-bottom: 0.5rem; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      max-width: 420px;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-bright);
      box-shadow: var(--shadow);
      font-size: 0.85rem;
      z-index: 100;
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok { border-left: 3px solid var(--green); }
    .toast.err { border-left: 3px solid var(--rose); }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">JS</div>
        <div>
          <h1>Jobsearch</h1>
          <p>Applications dashboard</p>
        </div>
      </div>
      <div class="sidebar-label">Snapshot days</div>
      <div class="day-list" id="dayList"></div>
      <div class="sidebar-footer">
        <button class="live-btn" id="liveBtn">↻ Refresh live registry</button>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <h2 id="viewTitle">Applications <span id="viewSubtitle"></span></h2>
        <div class="search">
          <input type="search" id="searchInput" placeholder="Search role or company…" />
        </div>
        <div class="filters" id="filters">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="linkedin_eligible">Apply first</button>
          <button class="chip" data-filter="linkedin_review">Needs review</button>
          <button class="chip" data-filter="boards">Boards</button>
          <button class="chip" data-filter="email">Email</button>
          <button class="chip" data-filter="form">Form</button>
          <button class="chip" data-filter="dm">Direct message</button>
        </div>
      </div>
      <div class="cards-wrap">
        <div class="cards-grid" id="cardsGrid"></div>
        <div class="empty" id="emptyState" hidden>
          <h3>No roles for this day</h3>
          <p>Run <code>jobsearch table</code> to generate a snapshot.</p>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let snapshot = { jobs: [] };
    let activeDay = null;
    let sectionFilter = "all";
    let searchQuery = "";

    const dayList = document.getElementById("dayList");
    const cardsGrid = document.getElementById("cardsGrid");
    const emptyState = document.getElementById("emptyState");
    const viewTitle = document.getElementById("viewTitle");
    const viewSubtitle = document.getElementById("viewSubtitle");
    const toast = document.getElementById("toast");

    function formatDay(iso) {
      if (iso === "live") return "Live";
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }

    function showToast(msg, ok = true) {
      toast.textContent = msg;
      toast.className = "toast show " + (ok ? "ok" : "err");
      setTimeout(() => toast.classList.remove("show"), 5000);
    }

    async function loadDays() {
      const res = await fetch("/api/days");
      const data = await res.json();
      dayList.innerHTML = "";
      const days = data.days || [];
      if (!days.length) return;
      days.forEach((d, i) => {
        const btn = document.createElement("button");
        btn.className = "day-btn" + (i === 0 ? " active" : "");
        btn.dataset.day = d.day;
        btn.innerHTML = `
          <div>
            <div class="date">${formatDay(d.day)}</div>
            <div class="meta">${d.generated_at ? new Date(d.generated_at).toLocaleTimeString() : "snapshot"}</div>
          </div>
          <span class="day-count">${d.job_count || "—"}</span>`;
        btn.onclick = () => selectDay(d.day, btn);
        dayList.appendChild(btn);
        if (i === 0) activeDay = d.day;
      });
    }

    async function loadSnapshot(day) {
      const res = await fetch("/api/snapshot?day=" + encodeURIComponent(day));
      if (!res.ok) throw new Error("Snapshot not found");
      snapshot = await res.json();
      viewSubtitle.textContent = `· ${snapshot.jobs.length} roles · ${day === "live" ? "live" : day}`;
      renderCards();
    }

    function selectDay(day, btn) {
      activeDay = day;
      document.querySelectorAll(".day-btn").forEach(b => b.classList.toggle("active", b === btn));
      loadSnapshot(day).catch(e => showToast(e.message, false));
    }

    function channelClass(ch) {
      if (ch === "email") return "badge-channel-email";
      if (ch === "url") return "badge-channel-url";
      return "badge-channel-dm";
    }

    function sectionLabel(s) {
      return { linkedin_eligible: "Apply first", linkedin_review: "Review", boards: "Board" }[s] || s;
    }

    function hasFormat(job, id) {
      return (job.application_formats || []).some(f => f.id === id);
    }

    function filteredJobs() {
      return snapshot.jobs.filter(j => {
        if (sectionFilter !== "all") {
          if (sectionFilter === "email") {
            if (!hasFormat(j, "email")) return false;
          } else if (sectionFilter === "form") {
            if (!hasFormat(j, "form")) return false;
          } else if (sectionFilter === "dm") {
            if (!hasFormat(j, "direct_message")) return false;
          } else if (j.section !== sectionFilter) return false;
        }
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const blob = (j.role + " " + j.company).toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    }

    const ACTION_ORDER = ["email", "form", "dm_connect", "dm_check", "dm_message"];

    function stepClickable(key, state) {
      if (!state.available && !state.in_progress) return false;
      if (state.done) return false;
      if (key === "dm_connect") return !state.in_progress;
      if (key === "dm_check") return state.in_progress;
      return state.available;
    }

    function renderStepPill(key, state, job) {
      if (!state.available && !state.done && !state.in_progress) return "";
      const done = state.done;
      const progress = state.in_progress && !done;
      const icon = done ? "✓" : (progress ? "◐" : "○");
      let cls = "step-pill";
      if (done) cls += " done";
      else if (progress) cls += " progress";
      const clickable = stepClickable(key, state);
      if (clickable) cls += " clickable";
      const statusText = state.status_text || (done ? "done" : "not applied");
      return `<button type="button" class="${cls}" data-action="${key}" data-job="${job.job_key}" ${clickable ? "" : "disabled"}>
        <span class="step-icon">${icon}</span>
        <span class="step-label">${esc(state.label)}</span>
        <span class="step-status">${esc(statusText)}</span>
      </button>`;
    }

    function renderSteps(actions, job) {
      return ACTION_ORDER.map(k => renderStepPill(k, actions[k] || {}, job)).join("");
    }

    function renderFormatTags(formats) {
      if (!formats || !formats.length) return "";
      const badgeClass = {
        email: "badge badge-channel-email",
        form: "badge badge-channel-url",
        direct_message: "badge badge-channel-dm",
      };
      return formats.map(f => {
        const cls = badgeClass[f.id] || "badge badge-section";
        return `<span class="${cls}">${esc(f.label)}</span>`;
      }).join("");
    }

    function renderCards() {
      const jobs = filteredJobs();
      cardsGrid.innerHTML = "";
      emptyState.hidden = jobs.length > 0;
      jobs.forEach(job => {
        const card = document.createElement("article");
        card.className = "card";
        const actions = job.actions || {};
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-title">${esc(job.role)}</div>
              <div class="card-company">${esc(job.company)}</div>
            </div>
          </div>
          <div class="badges">
            <span class="badge badge-track">${esc(job.track_label)}</span>
            ${job.section === "linkedin_review" ? '<span class="badge badge-review">Human review</span>' : ""}
          </div>
          <div class="card-meta">
            <div class="meta-item meta-item-full">
              <label>Application format</label>
              <div class="format-tags">${renderFormatTags(job.application_formats)}</div>
            </div>
            <div class="meta-item"><label>Role from</label><span>${esc(job.role_from_label)}</span></div>
            <div class="meta-item"><label>Salary</label><span>${esc(job.salary)}</span></div>
            <div class="meta-item"><label>Posted</label><span>${esc(job.posted)}</span></div>
            <div class="meta-item"><label>Location</label><span>${esc(job.location)}</span></div>
          </div>
          <div class="card-links">
            ${job.post_url && job.post_url.startsWith("http") ? `<a href="${esc(job.post_url)}" target="_blank" rel="noopener">Post ↗</a>` : ""}
            ${job.apply_url && job.apply_url.startsWith("http") ? `<a href="${esc(job.apply_url)}" target="_blank" rel="noopener">Apply link ↗</a>` : ""}
            ${job.profile_url ? `<a href="${esc(job.profile_url)}" target="_blank" rel="noopener">Profile ↗</a>` : ""}
          </div>
          <div class="steps-block">
            <label>Application steps</label>
            <div class="step-pills">${renderSteps(actions, job)}</div>
          </div>`;
        cardsGrid.appendChild(card);
      });

      cardsGrid.querySelectorAll(".step-pill.clickable").forEach(btn => {
        btn.onclick = () => runAction(btn);
      });
    }

    function esc(s) {
      if (!s) return "";
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    const ACTION_MAP = {
      email: "email_send",
      form: "form_apply",
      dm_connect: "dm_connect",
      dm_check: "dm_check",
      dm_message: "dm_message",
    };

    async function runAction(btn) {
      const raw = btn.dataset.action;
      const action = ACTION_MAP[raw] || raw;
      const job_key = btn.dataset.job;
      btn.classList.add("loading");
      const statusEl = btn.querySelector(".step-status");
      const prev = statusEl ? statusEl.textContent : "";
      if (statusEl) statusEl.textContent = "working…";
      try {
        const res = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, job_key }),
        });
        const data = await res.json();
        showToast(data.message || (data.ok ? "Done" : "Failed"), data.ok);
        if (data.snapshot) {
          snapshot = data.snapshot;
          renderCards();
        } else if (activeDay) {
          await loadSnapshot(activeDay);
        }
      } catch (e) {
        showToast(e.message, false);
        if (statusEl) statusEl.textContent = prev;
      } finally {
        btn.classList.remove("loading");
      }
    }

    document.getElementById("searchInput").oninput = e => {
      searchQuery = e.target.value.trim();
      renderCards();
    };

    document.querySelectorAll(".chip").forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        sectionFilter = chip.dataset.filter;
        renderCards();
      };
    });

    document.getElementById("liveBtn").onclick = () => {
      document.querySelectorAll(".day-btn").forEach(b => b.classList.remove("active"));
      activeDay = "live";
      loadSnapshot("live").catch(e => showToast(e.message, false));
    };

    (async () => {
      await loadDays();
      if (activeDay) await loadSnapshot(activeDay);
    })();
  </script>
</body>
</html>
