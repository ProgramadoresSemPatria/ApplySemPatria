name: Tests

on:
  push:
    branches: [ci/tests, main]
  pull_request:
    branches: [ci/tests, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify HAR fixtures (JSON integrity)
        run: ./scripts/run_tests.sh verify-hars

      - name: Unit tests (3× stability)
        run: REPEATS=3 ./scripts/run_tests.sh unit

  browser:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          patchright install chromium
          patchright install-deps chromium

      - name: HAR + Playwright tests (3× stability)
        run: REPEATS=3 ./scripts/run_tests.sh playwright
