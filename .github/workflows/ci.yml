name: CI

on:
  push:
    branches: [main, ci/tests]
  pull_request:
    branches: [main, ci/tests]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (verify-hars + pytest 3×)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify HAR fixtures
        run: ./scripts/run_tests.sh verify-hars

      - name: Coverage (unit tier)
        run: ./scripts/run_tests.sh coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            RATE=$(python -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage.xml').getroot(); print(f\"{float(r.attrib['line-rate'])*100:.1f}\")")
            LINES=$(python -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage.xml').getroot(); print(f\"{r.attrib['lines-covered']}/{r.attrib['lines-valid']}\")")
            {
              echo "### Coverage (unit tier)"
              echo "**${RATE}%** line coverage (${LINES} lines)"
              echo ""
              echo "Download \`coverage-html\` artifact for the browsable report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests (3× stability)
        run: REPEATS=3 ./scripts/run_tests.sh unit

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Unit job"
            echo "- verify-hars + unit pytest (3×)"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: browser (HAR + HTML + UI e2e 3×)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          patchright install chromium
          patchright install-deps chromium

      - name: Browser tests (3× stability)
        run: REPEATS=3 ./scripts/run_tests.sh playwright

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Browser job"
            echo "- HAR replay + HTML fixtures + UI e2e (3×)"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    name: ci gate
    runs-on: ubuntu-latest
    needs: [unit, browser]
    if: always()
    steps:
      - name: Require all jobs green
        run: |
          echo "unit: ${{ needs.unit.result }}"
          echo "browser: ${{ needs.browser.result }}"
          if [ "${{ needs.unit.result }}" != "success" ] || [ "${{ needs.browser.result }}" != "success" ]; then
            echo "::error::CI failed — check unit and browser jobs"
            exit 1
          fi
          echo "All CI jobs passed."

      - name: Summary
        run: |
          {
            echo "## CI passed"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| unit | ${{ needs.unit.result }} |"
            echo "| browser | ${{ needs.browser.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
